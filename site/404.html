<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Siden findes ikke – LumiHue</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#111518" />
    <meta name="color-scheme" content="dark" />
    <style>
      /* Selvstændig, så siden er pæn uanset hvilken sti den serveres fra */
      body {
        margin: 0;
        min-height: 100vh;
        background: #111518;
        color: #f2f4f2;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(960px, 100% - 32px);
        margin: 0 auto;
        padding: 96px 0 48px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 40em;
        color: #a8b5bc;
        font-size: 1.125rem;
      }
      a {
        color: #dcf99d;
        text-decoration: none;
        text-underline-offset: 3px;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Siden findes ikke</h1>
      <p>Adressen passer ikke til noget her. <a href="https://lumihue.app/">Gå til forsiden</a>.</p>
    </main>
  </body>
</html>
